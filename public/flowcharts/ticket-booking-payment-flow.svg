<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="AI Events Organiser ticket booking and payment flowchart">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <rect x="90" y="70" width="1740" height="940" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="960" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    AI Events Organiser - Ticket Booking &amp; Payment Flow
  </text>
  <text x="960" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b">
    Seamless ticket download experience with secure Razorpay payment handling
  </text>

  <g filter="url(#shadow)">
    <rect x="660" y="240" width="600" height="90" rx="24" fill="url(#blueGradient)"/>
    <text x="960" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
      User clicks &quot;Download Ticket&quot;
    </text>
  </g>

  <line x1="960" y1="330" x2="960" y2="390" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <polygon points="960,430 1180,500 960,570 740,500" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/>
    <text x="960" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">
      paymentStatus?
    </text>
  </g>

  <line x1="740" y1="500" x2="440" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1180" y1="500" x2="1480" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="600" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f59a8">Paid</text>
  <text x="1260" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f59a8">Not Paid</text>

  <g filter="url(#shadow)">
    <rect x="180" y="620" width="500" height="92" rx="24" fill="url(#greenGradient)"/>
    <text x="430" y="676" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
      Generate &amp; Download Ticket
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="620" width="500" height="92" rx="24" fill="url(#blueGradient)"/>
    <text x="1430" y="656" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
      Open Razorpay Payment Popup
    </text>
    <g>
      <rect x="1320" y="678" width="120" height="80" rx="16" fill="#ffffff" opacity="0.18"/>
      <rect x="1338" y="696" width="84" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="1348" y="706" width="20" height="20" fill="#2563eb"/>
      <rect x="1376" y="706" width="12" height="12" fill="#2563eb"/>
      <rect x="1392" y="706" width="16" height="16" fill="#2563eb"/>
      <rect x="1348" y="726" width="12" height="12" fill="#2563eb"/>
      <rect x="1368" y="736" width="20" height="20" fill="#2563eb"/>
      <rect x="1400" y="736" width="12" height="12" fill="#2563eb"/>
      <rect x="1348" y="748" width="10" height="10" fill="#2563eb"/>
    </g>
  </g>

  <line x1="1430" y1="712" x2="1430" y2="790" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1180" y="790" width="500" height="92" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1430" y="846" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">
      User Completes Payment
    </text>
  </g>

  <line x1="1430" y1="882" x2="1430" y2="950" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1180" y="950" width="500" height="92" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1430" y="1006" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">
      Verify Razorpay Signature
    </text>
  </g>

  <line x1="1180" y1="996" x2="760" y2="996" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="260" y="950" width="500" height="92" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="510" y="1006" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">
      Update paymentStatus in MongoDB
    </text>
  </g>

  <line x1="510" y1="950" x2="510" y2="880" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="260" y="788" width="500" height="92" rx="24" fill="url(#greenGradient)"/>
    <text x="510" y="844" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
      Generate &amp; Download Ticket
    </text>
  </g>

  <line x1="430" y1="712" x2="430" y2="788" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="960" y="1048" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94a3b8">
    Designed for project documentation, stakeholder reviews, and interview presentations
  </text>
</svg>
